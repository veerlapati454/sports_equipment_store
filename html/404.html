<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c10">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Apex Athletics</title>

  <!-- Google Fonts & Font Awesome Icons (same as the rest of the site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Work+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Shared site styles (this file lives in /html, so one level up) -->
  <link rel="stylesheet" href="../css/styles.css">

  <!-- Page-specific styles -->
  <style>
    .error-page {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 130px 25px 70px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse 620px 420px at 50% 42%, rgba(255, 69, 0, 0.14), transparent 65%),
        radial-gradient(ellipse 520px 420px at 8% 90%, rgba(0, 229, 255, 0.07), transparent 60%),
        repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.025) 0, rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 64px),
        var(--bg-dark);
    }

    .error-inner {
      max-width: 560px;
      width: 100%;
    }

    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(7rem, 30vw, 13rem);
      font-weight: 700;
      line-height: 0.85;
      letter-spacing: 6px;
      color: transparent;
      -webkit-text-stroke: 2px var(--primary);
      margin-bottom: 18px;
      animation: errorRise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .error-title {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 7vw, 3.2rem);
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1;
      color: #fff;
      margin-bottom: 14px;
    }

    .error-text {
      color: var(--text-muted);
      font-size: clamp(0.95rem, 2.6vw, 1.1rem);
      line-height: 1.6;
      max-width: 440px;
      margin: 0 auto 36px;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }

    .error-actions .btn {
      min-width: 200px;
    }

    .error-footer {
      background: #05070a;
      border-top: 1px solid var(--border-color);
      padding: 22px 25px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    @keyframes errorRise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .error-page { padding: 110px 16px 50px; }
      .error-actions { flex-direction: column; gap: 12px; }
      .error-actions .btn { width: 100%; min-width: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .error-code { animation: none; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-container">
      <a href="../index.html" class="logo-placeholder">
        <img src="../assets/logo.webp" alt="Apex Athletics" class="logo-img">
      </a>

      <nav class="nav-links" id="primary-nav">
        <a href="../index.html">Home</a>
        <a href="./categories.html">Categories</a>
        <a href="./products.html">Products</a>
        <a href="./whyus.html">Why Us</a>
        <a href="./about.html">About Us</a>
        <a href="./contact.html">Contact</a>
        <a href="./login.html" class="login-link">Login</a>
      </nav>

      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="primary-nav">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <!-- 404 CONTENT -->
  <main class="error-page">
    <div class="error-inner">
      <div class="error-code" aria-hidden="true">404</div>
      <h1 class="error-title">Page not found</h1>
      <p class="error-text">The link may be broken, or the page may have moved. Head back to where you were, or start again from the home page.</p>

      <div class="error-actions">
        <button type="button" class="btn btn-outline" id="goBackBtn">
          <i class="fa-solid fa-arrow-left"></i> Go Back
        </button>
        <a href="../index.html" class="btn btn-primary">
          <i class="fa-solid fa-house"></i> Go Home
        </a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="error-footer">
    <p>&copy; 2026 Apex Athletics Inc. All rights reserved.</p>
  </footer>

  <script>
    (function () {
      'use strict';

      /* Go Back: one real step back in browser history, so the previous
         page comes back exactly as the visitor left it (same scroll position).
         Only if that is not possible (page opened directly or in a new tab)
         does it use the saved last page, and then the home page. */
      var goBack = document.getElementById('goBackBtn');

      function cameFromThisSite() {
        try {
          return !!document.referrer &&
                 new URL(document.referrer).origin === window.location.origin;
        } catch (err) { return false; }
      }

      if (goBack) {
        goBack.addEventListener('click', function (e) {
          e.preventDefault();
          if (window.history.length > 1 && cameFromThisSite()) {
            window.history.back();
            return;
          }
          var last = null;
          try { last = sessionStorage.getItem('apexLastPage'); } catch (err) {}
          if (last && last !== window.location.href) {
            window.location.href = last;
          } else {
            window.location.href = '../index.html';
          }
        });
      }

      /* Mobile menu (same behaviour as the main site) */
      var toggle = document.querySelector('.menu-toggle');
      var nav = document.querySelector('.nav-links');
      var header = document.querySelector('header');

      function setOpen(open) {
        nav.classList.toggle('open', open);
        document.body.classList.toggle('nav-open', open);
        toggle.innerHTML = open
          ? '<i class="fa-solid fa-xmark"></i>'
          : '<i class="fa-solid fa-bars"></i>';
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      }

      if (toggle && nav) {
        toggle.addEventListener('click', function (e) {
          e.stopPropagation();
          setOpen(!nav.classList.contains('open'));
        });
        nav.querySelectorAll('a').forEach(function (a) {
          a.addEventListener('click', function () { setOpen(false); });
        });
        document.addEventListener('click', function (e) {
          if (nav.classList.contains('open') && !header.contains(e.target)) setOpen(false);
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') setOpen(false);
        });
        window.addEventListener('resize', function () {
          if (window.innerWidth > 992) setOpen(false);
        });
      }
    })();
  </script>
 
</body>
</html>
