<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>APEX ATHLETICS · Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Work+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    /* =========================================================
       APEX ATHLETICS — Admin Console
       Same tokens as the customer dashboard: dark ink background,
       OrangeRed primary, cyan secondary, Teko display + Work Sans body.
       ========================================================= */
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      background: #0A0C10;
      color: #F1F1F1;
      -webkit-font-smoothing: antialiased;
    }
    :root {
      --bg-dark: #0A0C10;
      --bg-deep: #06070a;
      --bg-card: #12151c;
      --bg-card-hover: #171b24;
      --border-color: rgba(255,255,255,0.09);
      --border-bright: rgba(255,255,255,0.18);
      --text-light: #F1F1F1;
      --text-muted: #9BA3AC;
      --text-faint: rgba(155,163,172,0.65);
      --primary: #FF4500;
      --primary-deep: #D93A00;
      --primary-soft: rgba(255,69,0,0.14);
      --primary-glow: rgba(255,69,0,0.35);
      --secondary: #00E5FF;
      --secondary-soft: rgba(0,229,255,0.12);
      --green: #29C08A;
      --green-soft: rgba(41,192,138,0.14);
      --danger: #FF5C5C;
      --danger-soft: rgba(255,92,92,0.12);
      --gold: #FFC94D;
      --gold-soft: rgba(255,201,77,0.14);
      --font-heading: 'Teko', sans-serif;
      --font-body: 'Work Sans', sans-serif;
      --ease: cubic-bezier(.19,1,.22,1);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
    }
    @media (prefers-reduced-motion: reduce){
      *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
    }
    ::selection{ background:var(--primary); color:#fff; }
    :focus-visible { outline: 2px solid var(--secondary); outline-offset: 2px; }

    .member-bar {
      background: var(--bg-deep); color: var(--text-muted);
      font-family: var(--font-heading); font-size: 13px; font-weight: 500;
      letter-spacing: 0.06em; text-align: center;
      padding: 7px 10px; position: sticky; top: 0; z-index: 60;
      border-bottom: 1px solid var(--border-color);
    }
    .member-bar strong { color: var(--secondary); }

    .dashboard-root { display: flex; min-height: 100vh; width: 100%; max-width: 100vw; position:relative; }
    .dashboard-root::before{
      content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image:radial-gradient(circle at 18% 20%, rgba(255,69,0,0.07) 0%, transparent 55%),
                       radial-gradient(circle at 85% 80%, rgba(0,229,255,0.05) 0%, transparent 55%);
    }
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 40; display: none; backdrop-filter: blur(4px);
    }
    .sidebar-overlay.show { display: block; animation: fadeIn .25s var(--ease); }
    @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
    .sidebar {
      width: 264px; flex-shrink: 0; background: var(--bg-card);
      border-right: 1px solid var(--border-color); display: flex; flex-direction: column;
      padding: 22px 16px 16px; position: fixed; left: 0; top: 34px;
      height: calc(100vh - 34px); overflow-y: auto; z-index: 30;
    }
    .sidebar-header { display: flex; align-items: center; justify-content: center; margin-bottom: 18px; padding: 10px 4px; position: relative; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; text-decoration: none; }
    .brand-logo { width: 170px; height: auto; max-height: 48px; object-fit: contain; display: block; }
    .close-btn {
      display: none; background: none; border: none; color: var(--text-muted);
      font-size: 15px; padding: 4px 8px; cursor:pointer;
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    }
    .unit-strip {
      font-family: var(--font-heading); font-size: 13px; font-weight: 500; letter-spacing: 0.04em;
      color: var(--secondary); text-transform: uppercase; text-align: center;
      padding: 9px 6px; margin-bottom: 16px; border: 1px solid var(--border-color); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--secondary-soft);
    }
    .unit-strip::before {
      content: ''; width: 6px; height: 6px; background: var(--secondary);
      border-radius: 50%; box-shadow: 0 0 8px rgba(0,229,255,0.5);
      animation: blink 2.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .sidebar-section-label {
      font-family:var(--font-heading); font-size: 12px; font-weight: 500; letter-spacing: 0.06em;
      color: var(--text-faint); text-transform: uppercase; margin: 14px 8px 8px;
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      background: none; border: none; width: 100%;
      padding: 10px 12px; border-radius: var(--radius-sm);
      color: var(--text-muted); font-size: 13.5px; font-weight: 500;
      text-align: left; transition: all .2s ease; position: relative; cursor:pointer;
      font-family: var(--font-body);
    }
    .nav-item:hover { background: var(--primary-soft); color: var(--text-light); transform:translateX(2px); }
    .nav-item.nav-active { background: var(--primary-soft); color: var(--primary); font-weight: 600; box-shadow: 0 0 0 1px var(--primary-glow) inset; }
    .nav-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
    .nav-badge { margin-left: auto; background: var(--primary); color: #fff; font-family:var(--font-heading); font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
    .sidebar-user {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; margin-top: 16px; margin-bottom: 4px;
      border-radius: var(--radius-sm); background: var(--bg-deep); border: 1px solid var(--border-color);
    }
    .sidebar-user-avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      background: var(--primary-soft); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-family:var(--font-heading); font-size: 16px; font-weight: 600; text-transform: uppercase;
    }
    .sidebar-user-info { min-width: 0; flex: 1; }
    .sidebar-user-name { font-size: 12.5px; font-weight: 600; color: var(--text-light); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform:capitalize; }
    .sidebar-user-email { font-size: 11px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout-full-btn {
      margin-top: 8px; width: 100%; padding: 11px; border-radius: var(--radius-sm);
      background: var(--danger-soft); border: 1px solid rgba(255,92,92,0.28);
      color: var(--danger); font-family:var(--font-heading); font-size: 13px; font-weight: 500; letter-spacing:.04em; text-transform:uppercase;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .2s ease; text-decoration: none; cursor: pointer;
    }
    .logout-full-btn:hover { background: rgba(255,92,92,0.2); }
    .main-content { flex: 1; min-width: 0; max-width: 100%; display: flex; flex-direction: column; margin-left: 264px; position:relative; z-index:1; }
    .topbar {
      position: sticky; top: 34px; z-index: 25;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 10px 24px;
      background: rgba(10,12,16,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      flex-wrap: nowrap; min-height: 62px;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex-shrink: 1; }
    .hamburger {
      display: none; flex-direction: column; justify-content: center; gap: 4px;
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      background: var(--bg-card); border: 1px solid var(--border-color);
      align-items: center; flex-shrink: 0; cursor:pointer;
    }
    .hamburger span { width: 16px; height: 2px; background: var(--text-light); border-radius: 2px; }
    .page-title { min-width: 0; display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
    .page-title h1 {
      font-family:var(--font-heading); letter-spacing:.01em; font-size: 28px; font-weight: 600; margin: 0;
      color: var(--text-light); white-space: nowrap; text-transform: uppercase;
    }
    .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-left: auto; }
    .search-box { display: flex; align-items: center; gap: 6px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 6px 10px; min-width: 0; }
    .search-box:focus-within { border-color: var(--primary); }
    .search-box input { background: none; border: none; outline: none; color: var(--text-light); font-size: 12px; width: 210px; max-width: 100%; min-width: 60px; font-family: var(--font-body); }
    .search-box input::placeholder { color: var(--text-faint); font-size: 11.5px; }
    .search-icon { font-size: 12px; opacity: 0.7; color: var(--text-muted); }
    .icon-btn {
      position: relative; width: 34px; height: 34px; border-radius: var(--radius-sm);
      background: var(--bg-card); border: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: center; font-size: 13px;
      flex-shrink: 0; cursor:pointer; transition:all .2s ease; color: var(--text-muted);
    }
    .icon-btn:hover{ border-color:var(--primary); transform:translateY(-1px); color: var(--primary); }
    .notif-dot {
      position: absolute; top: 6px; right: 6px; width: 6px; height: 6px;
      border-radius: 50%; background: var(--primary); border: 1.5px solid var(--bg-card);
      animation: notifPulse 2.2s ease-in-out infinite;
    }
    @keyframes notifPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,69,0,.35); } 50%{ box-shadow:0 0 0 4px rgba(255,69,0,0); } }
    .topbar-user { position: relative; flex-shrink: 0; }
    .topbar-user-btn {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 999px; padding: 3px 10px 3px 3px;
      transition: border-color .2s ease; cursor:pointer; color: inherit;
    }
    .topbar-user-btn:hover { border-color:var(--primary); }
    .topbar-user-avatar {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family:var(--font-heading); font-size: 14px; font-weight: 600; text-transform: uppercase;
    }
    .topbar-user-name { font-size: 11.5px; font-weight: 500; color: var(--text-light); max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform:capitalize; }
    .topbar-user-caret { font-size: 9px; color: var(--text-faint); }
    .topbar-user-menu {
      position: absolute; top: calc(100% + 8px); right: 0; width: 220px;
      background: var(--bg-card); border: 1px solid var(--border-bright);
      border-radius: 10px; padding: 8px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.5);
      opacity: 0; visibility: hidden; transform: translateY(-6px);
      transition: opacity .2s var(--ease), transform .2s var(--ease), visibility .2s ease;
      z-index: 60;
    }
    .topbar-user.open .topbar-user-menu { opacity: 1; visibility: visible; transform: translateY(0); }
    .topbar-user-menu-email { padding: 8px 10px 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 6px; }
    .topbar-user-menu-email .label { font-family:var(--font-heading); font-size: 11px; font-weight: 500; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; }
    .topbar-user-menu-email .value { font-size: 11.5px; font-weight: 600; color: var(--text-light); margin-top: 2px; word-break: break-all; }
    .topbar-user-menu-item {
      display: flex; align-items: center; gap: 9px; width: 100%;
      padding: 8px 10px; border-radius: var(--radius-sm);
      background: none; border: none; text-align: left;
      font-size: 11.5px; font-weight: 500; color: var(--text-muted);
      transition: background .15s ease, color .15s ease; cursor:pointer; font-family: var(--font-body);
    }
    .topbar-user-menu-item:hover { background: var(--primary-soft); color: var(--text-light); }
    .topbar-user-menu-item.danger:hover { background: var(--danger-soft); color: var(--danger); }

    .content-area { padding: 24px 28px 48px; min-width: 0; max-width: 100%; overflow-x: hidden; }
    .hero-banner {
      position: relative; border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 20px;
      border: 1px solid var(--border-bright); min-height: 150px; display: flex; align-items: center;
      background: linear-gradient(135deg, #171b24, var(--bg-deep));
    }
    .hero-banner::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--primary), #FF9466, var(--primary));
    }
    .hero-banner-inner { padding: 26px 30px; max-width: 620px; }
    .hero-eyebrow { font-family:var(--font-heading); font-size: 13px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--secondary); margin-bottom: 8px; }
    .hero-banner h2 { font-family:var(--font-heading); font-size: 30px; font-weight: 600; margin-bottom: 8px; color: #fff; letter-spacing: -0.01em; text-transform: uppercase; }
    .hero-banner p { font-size: 13.5px; color: rgba(241,241,241,0.62); line-height: 1.6; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; margin-bottom: 20px; }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 18px 18px 16px; min-width: 0;
      transition: all .25s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      opacity:0; transform:translateY(14px); animation: cardPop .5s var(--ease) forwards;
    }
    .stat-card[data-nav] { cursor: pointer; }
    .stats-grid .stat-card:nth-child(1){ animation-delay:.03s; }
    .stats-grid .stat-card:nth-child(2){ animation-delay:.09s; }
    .stats-grid .stat-card:nth-child(3){ animation-delay:.15s; }
    .stats-grid .stat-card:nth-child(4){ animation-delay:.21s; }
    @keyframes cardPop{ to{ opacity:1; transform:translateY(0); } }
    .stat-card:hover { border-color:var(--primary); transform:translateY(-3px); box-shadow:0 10px 26px rgba(255,69,0,0.14); }
    .stat-accent { border-color: var(--primary-glow); background:linear-gradient(145deg, var(--primary-soft), var(--bg-card) 70%); }
    .stat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .stat-icon { font-size: 16px; color: var(--primary); }
    .stat-delta { font-family:var(--font-heading); font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; }
    .stat-delta.up { color: var(--green); background: var(--green-soft); }
    .stat-delta.warn { color: var(--danger); background: var(--danger-soft); }
    .stat-value { font-family:var(--font-heading); font-size: 30px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-light); }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.03em; }
    .stat-bar { height: 5px; background: rgba(255,255,255,0.07); border-radius: 999px; margin-top: 12px; overflow: hidden; }
    .stat-bar-fill { height: 100%; width:0; background: linear-gradient(90deg, var(--primary-deep), var(--primary)); border-radius: 999px; transition: width 1.1s var(--ease) .3s; }
    .mid-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; margin-bottom: 0; align-items: start; }
    .bottom-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: start; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 20px; margin-bottom: 16px; min-width: 0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      opacity:0; transform:translateY(14px); animation: cardPop .5s var(--ease) .1s forwards;
    }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .card-title { font-family:var(--font-heading); letter-spacing:.01em; font-size: 20px; font-weight: 600; margin: 0; color: var(--text-light); text-transform: uppercase; }
    .card-sub { font-size: 12px; color: var(--text-muted); margin: 3px 0 0; font-family: var(--font-body); }
    .table-wrapper { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
    .runs-table { width: 100%; border-collapse: collapse; min-width: 640px; }
    .runs-table th {
      text-align: left; font-family:var(--font-heading); font-size: 12px; font-weight: 500; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--text-faint);
      padding: 0 10px 10px; border-bottom: 1px solid var(--border-color); white-space: nowrap;
    }
    .runs-table td { padding: 12px 10px; border-bottom: 1px solid var(--border-color); font-size: 13px; vertical-align: middle; }
    .runs-table tr:last-child td { border-bottom: none; }
    .runs-table tbody tr { transition: background .15s ease; cursor:pointer; }
    .runs-table tbody tr:hover { background: var(--primary-soft); }
    .runs-table.no-click tbody tr { cursor: default; }
    .empty-row td { text-align: center; color: var(--text-faint); padding: 28px 10px; }
    .t-name { font-weight: 600; font-family: var(--font-body); font-size: 14px; color: var(--text-light); }
    .t-sub { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; font-family: var(--font-body); }
    .date-col { color: var(--text-muted); white-space: nowrap; font-family: var(--font-body); font-size: 12px; }
    .budget-col { font-weight: 700; white-space: nowrap; font-family:var(--font-heading); font-size:15px; color: var(--primary); }
    .region-tag { font-family:var(--font-heading); font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; border: 1px solid; white-space: nowrap; text-transform: uppercase; }
    .status-badge { font-family:var(--font-heading); font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; white-space: nowrap; text-transform:uppercase; letter-spacing:.02em; }
    .status-active { background: var(--green-soft); color: var(--green); }
    .status-field { background: var(--secondary-soft); color: var(--secondary); }
    .status-complete { background: rgba(155,163,172,0.16); color: var(--text-muted); }
    .status-review { background: var(--danger-soft); color: var(--danger); }
    .status-gold { background: var(--gold-soft); color: var(--gold); }
    .progress-wrap { display: flex; align-items: center; gap: 8px; min-width: 100px; }
    .progress-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.07); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width:0; background: linear-gradient(90deg, var(--primary-deep), var(--primary)); border-radius: 999px; transition:width 1s var(--ease) .2s; }
    .progress-pct { font-family:var(--font-heading); font-size: 13px; color: var(--text-muted); flex-shrink: 0; min-width: 24px; text-align: right; }
    .activity-list { display: flex; flex-direction: column; gap: 4px; padding: 0; margin: 0; list-style: none; }
    .activity-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 6px; border-radius: var(--radius-sm); transition: background .15s ease; cursor:pointer; }
    .activity-item:hover { background: var(--primary-soft); }
    .act-icon { font-size: 15px; flex-shrink: 0; line-height: 1.4; color: var(--primary); width:18px; text-align:center; margin-top:1px; }
    .act-body { flex: 1; min-width: 0; }
    .act-text { font-size: 13px; margin: 0; line-height: 1.5; word-wrap: break-word; color: var(--text-light); }
    .act-time { font-family:var(--font-heading); font-size: 12px; color: var(--text-faint); margin-top: 4px; display: block; }
    .team-list { display: flex; flex-direction: column; gap: 4px; padding: 0; margin: 0; list-style: none; }
    .team-item { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-radius: var(--radius-sm); transition: background .15s ease; cursor:pointer; }
    .team-item:hover { background: var(--primary-soft); }
    .member-avatar {
      position: relative; width: 38px; height: 38px; border-radius: 50%;
      background: var(--bg-deep); border: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: center;
      font-family:var(--font-heading); font-size: 15px; font-weight: 600; color: var(--primary); flex-shrink: 0; text-transform: uppercase;
    }
    .member-info { flex: 1; min-width: 0; }
    .member-name { font-size: 13px; font-weight: 600; color: var(--text-light); }
    .member-role { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; font-family: var(--font-body); }
    .member-projects { text-align: center; flex-shrink: 0; }
    .proj-count { display: block; font-family:var(--font-heading); font-size: 17px; color: var(--primary); }
    .proj-label { display: block; font-family:var(--font-heading); font-size: 11px; color: var(--text-faint); text-transform:uppercase; }
    .milestone-list { display: flex; flex-direction: column; padding: 0; margin: 0; list-style: none; }
    .milestone-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 6px; border-radius: var(--radius-sm); position: relative; transition: background .15s ease; cursor:pointer; }
    .milestone-item:hover { background: var(--primary-soft); }

      });
    });
  }
  function applySearch() {
    const q = document.getElementById('global-search').value.trim().toLowerCase();
    document.querySelectorAll('[data-search]').forEach(el => {
      el.style.display = (!q || el.getAttribute('data-search').includes(q)) ? '' : 'none';
    });
  }

  // ─── DERIVED NUMBERS ───
  function weekRevenue() { return revenue7.reduce((a, d) => a + d.v, 0); }
  function liveOrders() { return orders.filter(o => o.status !== "Cancelled"); }
  function categoryRevenue() {
    const map = {};
    liveOrders().forEach(o => { map[o.category] = (map[o.category] || 0) + o.amount; });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }
  function lowStockProducts() { return products.filter(p => p.stock <= state.lowStockThreshold); }

  // ─── SHARED CHART / WIDGET BUILDERS ───
  function statCards(stats) {
    return stats.map(s =>
      `<div class="stat-card ${s.accent ? "stat-accent" : ""}" ${s.nav ? `data-nav="${s.nav}"` : ""}>
        <div class="stat-top"><i class="fa-solid ${s.icon} stat-icon"></i>${s.delta ? `<span class="stat-delta ${s.warn ? "warn" : "up"}">${s.delta}</span>` : ""}</div>
        <div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div>
        <div class="stat-bar"><div class="stat-bar-fill" data-w="${s.bar}"></div></div>
      </div>`
    ).join("");
  }

  function revenueChart() {
    const W = 600, H = 230, left = 44, right = 10, top = 24, bottom = 34;
    const cw = W - left - right, ch = H - top - bottom;
    const maxV = Math.max(...revenue7.map(d => d.v));
    const max = Math.ceil(maxV / 20000) * 20000;
    const grid = [0, .25, .5, .75, 1].map(t => {
      const y = top + ch - ch * t;
      return `<line x1="${left}" x2="${W - right}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,0.07)"/>
              <text x="${left - 8}" y="${y + 4}" text-anchor="end" class="chart-label">${Math.round(max * t / 1000)}k</text>`;
    }).join("");
    const slot = cw / revenue7.length, bw = Math.min(40, slot * 0.55);
    const bars = revenue7.map((d, i) => {
      const h = ch * d.v / max, x = left + slot * i + (slot - bw) / 2, y = top + ch - h, cx = x + bw / 2;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${d.v === maxV ? '#FF4500' : 'url(#barGrad)'}"/>
              <text x="${cx}" y="${y - 7}" text-anchor="middle" class="chart-val">${(d.v / 1000).toFixed(1)}k</text>
              <text x="${cx}" y="${H - 12}" text-anchor="middle" class="chart-label">${d.day}</text>`;
    }).join("");
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="Daily revenue for the last 7 days">
      <defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF4500" stop-opacity=".7"/><stop offset="1" stop-color="#FF4500" stop-opacity=".22"/></linearGradient></defs>
      ${grid}${bars}</svg>`;
  }

  function categoryDonut() {
    const data = categoryRevenue();
    const total = data.reduce((a, [, v]) => a + v, 0);
    let cum = 0;
    const segs = data.map(([cat, v]) => {
      const pct = v / total * 100;
      const seg = `<circle cx="60" cy="60" r="48" fill="none" stroke="${categoryAccents[cat]}" stroke-width="16" pathLength="100" stroke-dasharray="${pct.toFixed(2)} ${(100 - pct).toFixed(2)}" stroke-dashoffset="${(-cum).toFixed(2)}" transform="rotate(-90 60 60)"/>`;
      cum += pct;
      return seg;
    }).join("");
    const legend = data.map(([cat, v]) =>
      `<li class="legend-item"><span class="legend-dot" style="background:${categoryAccents[cat]}"></span>
        <span class="legend-label">${categoryName[cat]}</span>
        <span class="legend-count">${Math.round(v / total * 100)}%</span></li>`
    ).join("");
    return `<div class="donut-chart">
        <svg viewBox="0 0 120 120" class="donut-svg" role="img" aria-label="Revenue share by category">
          <circle cx="60" cy="60" r="48" fill="none" stroke="#1A1D25" stroke-width="16"/>
          ${segs}
          <text x="60" y="58" text-anchor="middle" class="donut-num">${liveOrders().length}</text>
          <text x="60" y="71" text-anchor="middle" class="donut-label">Orders</text>
        </svg></div>
      <ul class="legend-list">${legend}</ul>`;
  }

  function orderRow(o, editable) {
    const search = `${o.id} ${o.customer} ${o.items} ${categoryName[o.category]} ${o.status} ${o.payment || ""}`.toLowerCase();
    const statusCell = editable
      ? `<select class="pref-select compact" data-order-status="${o.id}" aria-label="Status for ${o.id}">${["Processing", "Shipped", "Delivered", "Cancelled"].map(s => `<option ${o.status === s ? "selected" : ""}>${s}</option>`).join("")}</select>`
      : `<span class="status-badge ${orderStatusColor[o.status]}">${o.status}</span>`;
    return `<tr ${editable ? "" : `data-nav="orders"`} data-search="${search}">
      <td><div class="t-name">${o.items}</div><div class="t-sub">${o.id}</div></td>
      <td><div class="t-name" style="font-size:13px">${o.customer}</div></td>
      <td>${regionTag(o.category)}</td>
      ${editable ? `<td class="date-col">${o.payment}</td>` : ""}

    const lowItems = low.sort((a, b) => a.stock - b.stock).slice(0, 5).map(p =>
      `<li class="team-item" data-nav="products" data-search="${(p.id + " " + p.name).toLowerCase()}">

      return `<li class="milestone-item">

        <span class="ms-tag" style="background:${c2}1F;color:${c2}">${ev.tag}</span>

    return `

  function renderOrders() {

      { icon: "fa-bag-shopping", value: orders.length, label: "Total Orders", bar: 100, accent: true },

      { icon: "fa-truck-fast", value: count("Shipped"), label: "Shipped", bar: Math.round(count("Shipped") / orders.length * 100) },

    ];
    const filters = ["All", "Processing", "Shipped", "Delivered", "Cancelled"];
    const tabs = filters.map(f =>
      `<button class="tab ${state.orderFilter === f ? "active" : ""}" data-orders-filter="${f}">${f}<span class="count">${f === "All" ? orders.length : count(f)}</span></button>`

  function renderProducts() {
    const low = lowStockProducts().filter(p => p.stock > 0).length;
    const out = products.filter(p => p.stock === 0).length;
    const invValue = products.reduce((a, p) => a + p.price * p.stock, 0);
    const stats = [
      { icon: "fa-boxes-stacked", value: products.length, label: "Products", bar: 100, accent: true },
      { icon: "fa-indian-rupee-sign", value: fmtCompact(invValue), label: "Inventory Value", bar: 70 },
      { icon: "fa-triangle-exclamation", value: low, label: "Low Stock", bar: Math.round(low / products.length * 100), warn: low > 0 },
      { icon: "fa-ban", value: out, label: "Out of Stock", bar: Math.round(out / products.length * 100), warn: out > 0 }
    ];
    const filterFns = {
      "All": () => true,
      "Low Stock": p => p.stock > 0 && p.stock <= state.lowStockThreshold,
      "Out of Stock": p => p.stock === 0
    };
    const tabs = Object.keys(filterFns).map(f =>
      `<button class="tab ${state.productFilter === f ? "active" : ""}" data-products-filter="${f}">${f}<span class="count">${products.filter(filterFns[f]).length}</span></button>`
    ).join("");

    const on = state.settings[key];
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:${last ? "18px 0 0" : "18px 0"};${last ? "" : "border-bottom:1px solid var(--border-color)"}">
      <div><div style="font-weight:700;color:var(--text-light);font-size:13.5px">${title}</div><div style="font-size:12.5px;color:var(--text-muted);margin-top:2px">${desc}</div></div>
      <div class="toggle-switch" id="toggle-${key}" data-toggle="${key}" role="switch" aria-checked="${on}" aria-label="${title}" tabindex="0" style="background:${on ? 'var(--primary)' : 'var(--primary-soft)'}">
        <div class="toggle-knob" id="toggle-knob-${key}" style="left:${on ? '20px' : '3px'}"></div>
      </div>
    </div>`;
  }

  function renderSettings() {
    const displayName = currentUsername || currentEmail || "Signed out";
    const displayEmail = currentEmail || "No account signed in";
    return `
      <div class="card">
        <div class="card-header"><div><h2 class="card-title">Account</h2><p class="card-sub">Your admin profile and session</p></div></div>
        <div style="display:flex;align-items:center;gap:18px;margin-bottom:20px;flex-wrap:wrap">
          <div style="width:64px;height:64px;border-radius:50%;border:2px solid var(--primary-glow);background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:28px;text-transform:uppercase;flex-shrink:0">${currentInitial}</div>
          <div><div style="font-weight:700;color:var(--text-light);font-size:17px;text-transform:capitalize;font-family:var(--font-heading)">${displayName}</div>
          <div style="font-size:13px;color:var(--text-muted);margin-top:2px">${displayEmail}</div>
          <div style="font-family:var(--font-heading);font-size:13px;color:var(--secondary);margin-top:4px">Administrator</div></div>
        </div>
        <button class="btn-outline" style="border-color:var(--primary);color:var(--primary)" onclick="go404()">Edit Profile</button>
      </div>
      <div class="card">
        <div class="card-header"><div><h2 class="card-title">Store Preferences</h2><p class="card-sub">Alerts and inventory rules</p></div></div>
        <div>
          ${toggleRow("newOrders", "New Order Alerts", "Notify me when an order is placed")}
          ${toggleRow("lowStock", "Low Stock Alerts", "Notify me when a product runs low")}
          ${toggleRow("weeklyReport", "Weekly Sales Report", "Email a summary every Monday morning")}
          ${toggleRow("maintenance", "Maintenance Mode", "Show a maintenance page to shoppers")}
          <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding-top:18px;border-top:1px solid var(--border-color);margin-top:18px">
            <div><div style="font-weight:700;color:var(--text-light);font-size:13.5px">Low-stock threshold</div><div style="font-size:12.5px;color:var(--text-muted);margin-top:2px">Flag products at or below this many units</div></div>
            <select class="pref-select" id="threshold-select" aria-label="Low-stock threshold">${[5, 10, 15, 20].map(n => `<option value="${n}" ${state.lowStockThreshold === n ? "selected" : ""}>${n} units</option>`).join("")}</select>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div><h2 class="card-title">Session</h2><p class="card-sub">Sign out of the admin console</p></div></div>
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px">
          <div style="font-size:12.5px;color:var(--text-muted)">Signed in as <strong style="color:var(--text-light)">${displayEmail}</strong>.</div>
          <button class="btn-outline" style="border-color:rgba(255,92,92,0.35);color:var(--danger);flex-shrink:0" id="settings-logout-btn"><i class="fa-solid fa-right-from-bracket"></i>&nbsp; Logout</button>
        </div>
      </div>
      <div class="card" style="border-color:rgba(255,92,92,0.28);">
        <div class="card-header"><div><h2 class="card-title">Account Controls</h2><p class="card-sub">Irreversible actions</p></div></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn-outline" style="border-color:rgba(255,92,92,0.35);color:var(--danger)" onclick="go404()">Reset Password</button>
          <button class="btn-outline" style="border-color:rgba(255,92,92,0.35);color:var(--danger)" onclick="go404()">Delete Admin Account</button>
        </div>
      </div>`;
  }

  const pageRenderers = {
    dashboard: renderDashboard, orders: renderOrders, products: renderProducts,
    customers: renderCustomers, analytics: renderAnalytics, support: renderSupport, settings: renderSettings
  };

  // ─── NAVIGATION ───
  function renderNav() {
    const badges = {
      orders: orders.filter(o => o.status === "Processing").length,
      support: supportTickets.filter(t => t.status === "Open").length
    };
    function itemHtml(item) {
      const b = badges[item.id];
      const badge = b ? `<span class="nav-badge">${b}</span>` : "";
      return `<button class="nav-item ${state.activeNav === item.id ? "nav-active" : ""}" data-nav="${item.id}">
        <i class="fa-solid ${item.icon} nav-icon"></i><span>${item.label}</span>${badge}</button>`;
    }
    document.getElementById("nav-main").innerHTML = navItemsList.slice(0, 4).map(itemHtml).join("");
    document.getElementById("nav-management").innerHTML = navItemsList.slice(4).map(itemHtml).join("");
  }

  function renderPage(keepScroll) {
    document.getElementById("page-title-text").textContent = pageMap[state.activeNav].title;
    document.getElementById("content-area").innerHTML = pageRenderers[state.activeNav]();
    renderNav();
    const settingsLogoutBtn = document.getElementById("settings-logout-btn");
    if (settingsLogoutBtn) settingsLogoutBtn.addEventListener("click", logout);
    if (!keepScroll) window.scrollTo({ top: 0, left: 0, behavior: "instant" });
    animateStatBars();
    applySearch();
  }

  function navigateTo(id) {
    state.activeNav = id;
    localStorage.setItem('apexAdminNav', id);
    document.getElementById('global-search').value = '';
    closeSidebar();
    closeTopbarUserMenu();
    renderPage();
  }

  function openSidebar() {
    document.getElementById("sidebar").classList.add("sidebar-open");
    document.getElementById("sidebar-overlay").classList.add("show");
  }
  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("sidebar-open");
    document.getElementById("sidebar-overlay").classList.remove("show");
  }
  function closeTopbarUserMenu() {
    document.getElementById("topbar-user").classList.remove("open");
  }

  // ─── ACTIONS ───
  function updateOrderStatus(id, status) {
    const o = orders.find(x => x.id === id);
    if (!o) return;
    o.status = status;
    toast(`Order ${id} marked ${status.toLowerCase()}`);
    renderPage(true);
  }
  function restock(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    p.stock += 10;
    toast(`Added 10 units to ${p.name}`);
    renderPage(true);
  }
  function toggleTicket(id) {
    const t = supportTickets.find(x => x.id === id);
    if (!t) return;
    const resolving = t.status !== "Resolved";
    t.status = resolving ? "Resolved" : "Open";
    t.updated = "just now";
    toast(resolving ? `Ticket ${id} resolved` : `Ticket ${id} reopened`);
    renderPage(true);
  }
  // Settings toggles update in place — no full re-render, no scroll reset
  function toggleSetting(key) {
    state.settings[key] = !state.settings[key];
    const track = document.getElementById(`toggle-${key}`);
    const knob = document.getElementById(`toggle-knob-${key}`);
    if (!track || !knob) return;
    const isOn = state.settings[key];
    track.style.background = isOn ? 'var(--primary)' : 'var(--primary-soft)';
    track.setAttribute('aria-checked', isOn);
    knob.style.left = isOn ? '20px' : '3px';
    toast(isOn ? 'Preference turned on' : 'Preference turned off');
  }

  // ─── EVENT BINDING ───
  document.getElementById("hamburger-btn").addEventListener("click", openSidebar);
  document.getElementById("close-sidebar-btn").addEventListener("click", closeSidebar);
  document.getElementById("sidebar-overlay").addEventListener("click", closeSidebar);
  document.getElementById("notif-btn").addEventListener("click", function () {
    const n = orders.filter(o => o.status === "Processing").length;
    const t = supportTickets.filter(x => x.status === "Open").length;
    toast(`${n} orders to fulfil · ${t} open tickets`);
  });
  document.getElementById("logout-btn").addEventListener("click", logout);
  document.getElementById("topbar-logout-btn").addEventListener("click", logout);
  document.getElementById("global-search").addEventListener("input", applySearch);
  document.getElementById("topbar-user-btn").addEventListener("click", function (e) {
    e.stopPropagation();
    document.getElementById("topbar-user").classList.toggle("open");
  });
  document.addEventListener("click", closeTopbarUserMenu);

  document.addEventListener("click", function (e) {
    const restockBtn = e.target.closest("[data-restock]");
    if (restockBtn) { restock(restockBtn.getAttribute("data-restock")); return; }
    const ticketBtn = e.target.closest("[data-ticket-toggle]");
    if (ticketBtn) { toggleTicket(ticketBtn.getAttribute("data-ticket-toggle")); return; }
    const of = e.target.closest("[data-orders-filter]");
    if (of) { state.orderFilter = of.getAttribute("data-orders-filter"); renderPage(true); return; }
    const pf = e.target.closest("[data-products-filter]");
    if (pf) { state.productFilter = pf.getAttribute("data-products-filter"); renderPage(true); return; }
    const navBtn = e.target.closest("[data-nav]");
    if (navBtn) { navigateTo(navBtn.getAttribute("data-nav")); return; }
    const toggle = e.target.closest("[data-toggle]");
    if (toggle) { toggleSetting(toggle.getAttribute("data-toggle")); return; }
  });
  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-toggle]")) {
      e.preventDefault();
      toggleSetting(e.target.getAttribute("data-toggle"));
    }
  });

  document.addEventListener("change", function (e) {
    const t = e.target;
    if (t && t.hasAttribute && t.hasAttribute("data-order-status")) {
      updateOrderStatus(t.getAttribute("data-order-status"), t.value);
    } else if (t && t.id === "threshold-select") {
      state.lowStockThreshold = parseInt(t.value, 10);
      toast(`Low-stock threshold set to ${state.lowStockThreshold} units`);
    }
  });

  // ─── INIT ───
  if (currentAdmin) {
    paintUserChrome();
    renderPage();
  }
</script>
</body>
</html>
